server {
    listen 80;
    server_name $SERVER_NAME;

    location /static/ {
        alias $STATIC_PATH/;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        include proxy_params;
        proxy_redirect off;
    }
}